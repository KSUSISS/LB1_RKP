<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новый студент</title>
    <!-- Подключение CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="container">
    <h1>Форма информации о студенте</h1>

    <form action="#" th:action="@{/form}" th:object="${student}" method="post">

        <div class="form-group">
            <label>ID:</label>
            <input type="number" th:field="*{id}" placeholder="Введите ID" required />
        </div>

        <div class="form-group">
            <label>Фамилия:</label>
            <input type="text" th:field="*{lastName}" placeholder="Введите фамилию" required />
        </div>

        <div class="form-group">
            <label>Имя:</label>
            <input type="text" th:field="*{name}" placeholder="Введите имя" required />
        </div>

        <div class="form-group">
            <label>Отчество:</label>
            <input type="text" th:field="*{middleName}" placeholder="Введите отчество" required />
        </div>

        <div class="form-group">
            <label>E-mail:</label>
            <input type="email" th:field="*{email}" placeholder="example@mail.com" required />
        </div>

        <div class="form-group">
            <label>Год поступления:</label>
            <input type="number" th:field="*{admissionYear}" placeholder="Например: 2020" required />
        </div>

        <div class="button-group">
            <input type="submit" value="Отправить" />
            <input type="reset" value="Сбросить" />
        </div>

    </form>
</div>
</body>
</html>
